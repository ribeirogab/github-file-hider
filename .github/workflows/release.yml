name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:e2e

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture the prototype baselines on this runner
        run: pnpm visual:baseline
      - run: pnpm test:visual
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-results
          path: tests/visual/results
          if-no-files-found: ignore

  publish:
    needs: [test, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package the extension
        id: package
        run: |
          archive="$(node scripts/release.mjs)"
          version="$(node -p "require('./dist/manifest.json').version_name")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.package.outputs.version }}" \
            "${{ steps.package.outputs.archive }}" \
            --title "${{ steps.package.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes
