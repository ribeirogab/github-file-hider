		<link rel="stylesheet" href="./lib/gh.css" />
		<link rel="stylesheet" href="./lib/proto.css" />
		<style>
			:root,
			[data-gh-theme="light"] {
				--fh-fg: #1f2328;
				--fh-fg-muted: #59636e;
				--fh-fg-disabled: #818b98;
				--fh-fg-on-emphasis: #ffffff;
				--fh-bg: #ffffff;
				--fh-bg-muted: #f6f8fa;
				--fh-bg-header: #f6f8fa;
				--fh-overlay-bg: #ffffff;
				--fh-border: #d1d9e0;
				--fh-border-muted: #d1d9e0b3;
				--fh-accent: #0969da;
				--fh-accent-emphasis: #0969da;
				--fh-accent-muted: #ddf4ff;
				--fh-accent-border: #54aeff66;
				--fh-attention: #9a6700;
				--fh-attention-emphasis: #9a6700;
				--fh-danger: #d1242f;
				--fh-danger-emphasis: #cf222e;
				--fh-danger-muted: #ffebe9;
				--fh-success: #1a7f37;
				--fh-success-emphasis: #1a7f37;
				--fh-neutral-muted: #818b981f;
				--fh-control-bg: #f6f8fa;
				--fh-control-hover: #eff2f5;
				--fh-control-active: #e6eaef;
				--fh-control-border: #d1d9e0;
				--fh-control-disabled: #eff2f5;
				--fh-transparent-hover: #818b981a;
				--fh-transparent-active: #818b9826;
				--fh-transparent-selected: #818b9826;
				--fh-primary-bg: #1f883d;
				--fh-primary-hover: #1c8139;
				--fh-primary-border: #1f232826;
				--fh-track-bg: #e6eaef;
				--fh-track-hover: #dde3e9;
				--fh-track-border: transparent;
				--fh-knob-bg: #ffffff;
				--fh-knob-border: #818b98;
				--fh-checked: #0969da;
				--fh-checked-hover: #0860ca;
				--fh-check-border: #818b98;
				--fh-input-bg: #ffffff;
				--fh-tooltip-bg: #25292e;
				--fh-tooltip-fg: #ffffff;
				--fh-focus: #0969da;
				--fh-logo-ink: #1f2328;
				--fh-logo-band: #0969da;
				--fh-chrome-bg: #e9edf1;
				--fh-chrome-omni: #ffffff;
				--fh-canvas-dot: #d1d9e0;
				--fh-shadow-resting-small: 0 1px 1px 0 #1f23280f, 0 1px 3px 0 #1f23280f;
				--fh-shadow-floating-small: 0 0 0 1px #d1d9e080, 0 6px 12px -3px #25292e0a, 0 6px 18px 0 #25292e1f;
				--fh-shadow-button: 0 1px 0 0 #1f23280a;
				--fh-shadow-inset: inset 0 1px 0 0 #d1d9e033;
			}

			[data-gh-theme="dark"] {
				--fh-fg: #f0f6fc;
				--fh-fg-muted: #9198a1;
				--fh-fg-disabled: #656c76;
				--fh-fg-on-emphasis: #ffffff;
				--fh-bg: #0d1117;
				--fh-bg-muted: #151b23;
				--fh-bg-header: #010409;
				--fh-overlay-bg: #151b23;
				--fh-border: #3d444d;
				--fh-border-muted: #3d444db3;
				--fh-accent: #4493f8;
				--fh-accent-emphasis: #1f6feb;
				--fh-accent-muted: #388bfd1a;
				--fh-accent-border: #388bfd66;
				--fh-attention: #d29922;
				--fh-attention-emphasis: #9e6a03;
				--fh-danger: #f85149;
				--fh-danger-emphasis: #da3633;
				--fh-danger-muted: #f851491a;
				--fh-success: #3fb950;
				--fh-success-emphasis: #238636;
				--fh-neutral-muted: #656c7633;
				--fh-control-bg: #212830;
				--fh-control-hover: #262c36;
				--fh-control-active: #2a313c;
				--fh-control-border: #3d444d;
				--fh-control-disabled: #212830;
				--fh-transparent-hover: #656c7633;
				--fh-transparent-active: #656c7640;
				--fh-transparent-selected: #656c7626;
				--fh-primary-bg: #238636;
				--fh-primary-hover: #29903b;
				--fh-primary-border: #ffffff1a;
				--fh-track-bg: #262c36;
				--fh-track-hover: #2a313c;
				--fh-track-border: #3d444d;
				--fh-knob-bg: #0d1117;
				--fh-knob-border: #656c76;
				--fh-checked: #1f6feb;
				--fh-checked-hover: #2a7aef;
				--fh-check-border: #6e7681;
				--fh-input-bg: #0d1117;
				--fh-tooltip-bg: #3d444d;
				--fh-tooltip-fg: #ffffff;
				--fh-focus: #1f6feb;
				--fh-logo-ink: #f0f6fc;
				--fh-logo-band: #4493f8;
				--fh-chrome-bg: #1c2128;
				--fh-chrome-omni: #2d333b;
				--fh-canvas-dot: #3d444d;
				--fh-shadow-resting-small: 0 1px 1px 0 #01040999, 0 1px 3px 0 #01040999;
				--fh-shadow-floating-small: 0 0 0 1px #3d444d, 0 6px 12px -3px #01040966, 0 6px 18px 0 #01040966;
				--fh-shadow-button: 0 0 0 0 #0000;
				--fh-shadow-inset: 0 0 0 0 #0000;
			}

			:root {
				--fh-font: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
				--fh-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
				--fh-dur-instant: 80ms;
				--fh-dur-fast: 120ms;
				--fh-dur-base: 200ms;
				--fh-dur-slow: 240ms;
				--fh-ease-out: cubic-bezier(0.33, 1, 0.68, 1);
				--fh-ease-quad: cubic-bezier(0.5, 1, 0.89, 1);
				--fh-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
				--fh-sticky-offset: calc(var(--proto-h, 0px) + 52px);
			}

			html {
				background: var(--fh-bg);
			}

			.fh-sr {
				position: absolute !important;
				width: 1px;
				height: 1px;
				margin: -1px;
				padding: 0;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
				border: 0;
			}

			.fh-logo {
				display: block;
				flex: none;
				color: var(--fh-logo-ink);
			}

			.fh-logo-band {
				fill: var(--fh-logo-band);
			}

			.fh-logo-tile {
				display: inline-grid;
				place-items: center;
				flex: none;
				width: var(--tile, 48px);
				height: var(--tile, 48px);
				border-radius: calc(var(--tile, 48px) * 0.22);
				background: var(--fh-bg);
				box-shadow:
					0 0 0 1px var(--fh-border),
					var(--fh-shadow-resting-small);
			}

			.fh-ctl {
				display: inline-flex;
				align-items: center;
				margin-left: 4px;
				font-family: var(--fh-font);
			}

			button.fh-ctl-btn {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				height: 28px;
				padding: 0 8px;
				border: 0;
				border-radius: 6px;
				background: transparent;
				color: var(--fh-fg-muted);
				font: 500 12px/20px var(--fh-font);
				white-space: nowrap;
				cursor: pointer;
				transition:
					background-color var(--fh-dur-fast) var(--fh-ease-out),
					color var(--fh-dur-fast) var(--fh-ease-out);
			}

			button.fh-ctl-btn[hidden] {
				display: none;
			}

			button.fh-ctl-btn:hover,
			button.fh-ctl-btn.is-hover {
				background: var(--fh-transparent-hover);
				color: var(--fh-fg);
			}

			button.fh-ctl-btn:active {
				background: var(--fh-transparent-active);
			}

			button.fh-ctl-btn:focus {
				outline: none;
			}

			button.fh-ctl-btn:focus-visible,
			button.fh-ctl-btn.is-focus {
				outline: 2px solid var(--fh-focus);
				outline-offset: -2px;
			}

			button.fh-ctl-btn[aria-expanded="true"] {
				background: var(--fh-transparent-selected);
				color: var(--fh-fg);
			}

			.fh-ctl-btn .gh-icon {
				color: var(--fh-fg-muted);
			}

			.fh-ctl[data-split] .fh-ctl-main {
				border-radius: 6px 0 0 6px;
			}

			.fh-ctl[data-split] .fh-ctl-menu {
				border-radius: 0 6px 6px 0;
				padding: 0 6px;
			}

			.fh-ctl-sep {
				width: 1px;
				height: 16px;
				background: var(--fh-border);
				flex: none;
			}

			.fh-ctl-sep[hidden] {
				display: none;
			}

			.fh-ctl-status {
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}

			.fh-ctl-status .fh-label {
				margin-left: 2px;
			}

			.fh-ctl[data-view="filtering"] .fh-ctl-menu {
				color: var(--fh-fg);
			}

			.fh-ctl[data-view="filtering"] .fh-ctl-icon {
				color: var(--fh-accent);
			}

			.fh-ctl[data-view="filtering"] .fh-ctl-status {
				animation: fh-pop var(--fh-dur-base) var(--fh-ease-out);
			}

			.fh-ctl-caret {
				margin: 0 -2px 0 -2px;
			}

			@keyframes fh-pop {
				from {
					opacity: 0.4;
					transform: scale(0.96);
				}
			}

			.fh-counter {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				min-width: 20px;
				height: 20px;
				padding: 0 6px;
				border: 1px solid transparent;
				border-radius: 2em;
				background: var(--fh-neutral-muted);
				color: var(--fh-fg);
				font: 500 12px/18px var(--fh-font);
				vertical-align: middle;
			}

			.fh-counter.is-accent {
				background: var(--fh-accent-muted);
				color: var(--fh-accent);
			}

			.fh-roll {
				display: inline-grid;
				overflow: hidden;
				height: 18px;
			}

			.fh-roll > span {
				grid-area: 1 / 1;
				display: block;
				text-align: center;
			}

			.fh-roll-out {
				animation: fh-roll-out var(--fh-dur-base) var(--fh-ease-out) both;
			}

			.fh-roll-in {
				animation: fh-roll-in var(--fh-dur-base) var(--fh-ease-out) both;
			}

			@keyframes fh-roll-out {
				to {
					transform: translateY(calc(-100% * var(--dir, 1)));
					opacity: 0;
				}
			}

			@keyframes fh-roll-in {
				from {
					transform: translateY(calc(100% * var(--dir, 1)));
					opacity: 0;
				}
			}

			.fh-label {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				box-sizing: border-box;
				height: 20px;
				padding: 0 7px;
				border: 1px solid var(--fh-border);
				border-radius: 2em;
				background: transparent;
				color: var(--fh-fg-muted);
				font: 500 12px/1 var(--fh-font);
				white-space: nowrap;
				vertical-align: middle;
			}

			.fh-label.is-accent {
				color: var(--fh-accent);
				border-color: var(--fh-accent-emphasis);
			}

			.fh-label.is-attention {
				color: var(--fh-attention);
				border-color: var(--fh-attention-emphasis);
			}

			.fh-label.is-success {
				color: var(--fh-success);
				border-color: var(--fh-success-emphasis);
			}

			.fh-label[tabindex]:focus-visible {
				outline: 2px solid var(--fh-focus);
				outline-offset: 2px;
			}

			.fh-label .gh-icon {
				width: 12px;
				height: 12px;
			}

			.fh-overlay {
				position: fixed;
				z-index: 100;
				box-sizing: border-box;
				width: 320px;
				max-width: calc(100vw - 16px);
				overflow: auto;
				overscroll-behavior: contain;
				padding-bottom: 8px;
				border-radius: 12px;
				background: var(--fh-overlay-bg);
				color: var(--fh-fg);
				box-shadow: var(--fh-shadow-floating-small);
				font: 400 14px/20px var(--fh-font);
				text-align: left;
				outline: none;
				-webkit-font-smoothing: antialiased;
				animation: fh-overlay-in var(--fh-dur-base) var(--fh-ease-out);
			}

			.fh-overlay *,
			.fh-overlay *::before,
			.fh-overlay *::after {
				box-sizing: border-box;
			}

			.fh-overlay.is-static {
				position: relative;
				z-index: auto;
				animation: none;
				max-width: 100%;
			}

			@keyframes fh-overlay-in {
				from {
					opacity: 0;
					transform: translateY(-4px);
				}
			}

			.fh-ov-header {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 12px 16px;
			}

			.fh-ov-title {
				flex: 1;
				min-width: 0;
				font-weight: 600;
			}

			.fh-al-divider {
				display: block;
				height: 1px;
				margin: 8px 0;
				border: 0;
				background: var(--fh-border-muted);
			}

			.fh-ov-header + .fh-al-divider {
				margin-top: 0;
			}

			.fh-al-heading {
				margin: 0;
				padding: 6px 16px;
				font-size: 12px;
				line-height: 20px;
				font-weight: 600;
				color: var(--fh-fg-muted);
			}

			.fh-al-item {
				position: relative;
				display: flex;
				align-items: flex-start;
				gap: 8px;
				min-height: 32px;
				margin: 0 8px;
				padding: 6px 8px;
				border-radius: 6px;
				color: var(--fh-fg);
				cursor: pointer;
				user-select: none;
				transition: background-color var(--fh-dur-fast) var(--fh-ease-out);
			}

			.fh-al-item:hover,
			.fh-al-item.is-hover {
				background: var(--fh-transparent-hover);
			}

			.fh-al-item:active {
				background: var(--fh-transparent-active);
			}

			.fh-al-item:focus {
				outline: none;
			}

			.fh-al-item:focus-visible,
			.fh-al-item.is-focus {
				outline: 2px solid var(--fh-focus);
				outline-offset: -2px;
				background: var(--fh-transparent-hover);
			}

			.fh-al-lead {
				display: flex;
				align-items: center;
				justify-content: center;
				flex: none;
				width: 16px;
				height: 20px;
				color: var(--fh-fg-muted);
			}

			.fh-al-content {
				display: flex;
				flex-direction: column;
				flex: 1;
				min-width: 0;
			}

			.fh-al-label {
				display: block;
			}

			.fh-al-desc {
				display: block;
				overflow: hidden;
				font-size: 12px;
				line-height: 16px;
				color: var(--fh-fg-muted);
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.fh-al-desc code {
				font: 11px/16px var(--fh-mono);
			}

			.fh-al-trail {
				display: flex;
				align-items: center;
				gap: 4px;
				flex: none;
				min-height: 20px;
				color: var(--fh-fg-muted);
				font-size: 12px;
				line-height: 20px;
			}

			.fh-al-trail.is-switch {
				align-self: center;
			}

			.fh-al-count.is-live {
				color: var(--fh-fg);
				font-weight: 500;
			}

			.fh-ov-empty {
				display: flex;
				gap: 12px;
				margin: 0 8px;
				padding: 8px;
				border-radius: 6px;
			}

			.fh-ov-empty-visual {
				display: grid;
				place-items: center;
				flex: none;
				width: 32px;
				height: 32px;
				border-radius: 8px;
				background: var(--fh-accent-muted);
				color: var(--fh-accent);
			}

			.fh-ov-empty strong {
				display: block;
				font-weight: 600;
			}

			.fh-ov-empty p {
				margin: 2px 0 0;
				font-size: 12px;
				line-height: 18px;
				color: var(--fh-fg-muted);
			}

			.fh-check {
				display: grid;
				place-items: center;
				box-sizing: border-box;
				width: 16px;
				height: 16px;
				border: 1px solid var(--fh-check-border);
				border-radius: 3px;
				background: var(--fh-bg);
				transition:
					background-color var(--fh-dur-instant) var(--fh-ease-quad),
					border-color var(--fh-dur-instant) var(--fh-ease-quad);
			}

			.fh-check .gh-icon {
				width: 12px;
				height: 12px;
				color: var(--fh-fg-on-emphasis);
				stroke-width: 2;
				opacity: 0;
				transform: scale(0.6);
				transition:
					opacity var(--fh-dur-instant) var(--fh-ease-quad),
					transform var(--fh-dur-fast) var(--fh-ease-out);
			}

			[aria-checked="true"] > .fh-al-lead .fh-check {
				background: var(--fh-checked);
				border-color: var(--fh-checked);
			}

			[aria-checked="true"] > .fh-al-lead .fh-check .gh-icon {
				opacity: 1;
				transform: none;
			}

			.fh-switch {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				flex: none;
			}

			.fh-switch-status {
				min-width: 22px;
				font-size: 14px;
				line-height: 20px;
				color: var(--fh-fg);
				text-align: right;
			}

			.fh-switch-status.is-disabled {
				color: var(--fh-fg-disabled);
			}

			.fh-switch-track {
				position: relative;
				display: block;
				flex: none;
				box-sizing: border-box;
				width: 48px;
				height: 24px;
				margin: 0;
				padding: 0;
				border: 1px solid var(--fh-track-border);
				border-radius: 6px;
				background: var(--fh-track-bg);
				overflow: hidden;
				cursor: pointer;
				appearance: none;
				transition:
					background-color var(--fh-dur-instant) var(--fh-ease-quad),
					border-color var(--fh-dur-instant) var(--fh-ease-quad);
			}

			.fh-switch-track::before {
				content: "";
				position: absolute;
				top: 50%;
				left: 25%;
				width: 2px;
				height: 10px;
				margin: -5px 0 0 -1px;
				border-radius: 1px;
				background: var(--fh-fg-on-emphasis);
				opacity: 0;
				transition: opacity var(--fh-dur-instant) var(--fh-ease-quad);
			}

			.fh-switch-track::after {
				content: "";
				position: absolute;
				top: 50%;
				left: 75%;
				box-sizing: border-box;
				width: 10px;
				height: 10px;
				margin: -5px 0 0 -5px;
				border: 1.5px solid var(--fh-fg-muted);
				border-radius: 50%;
				transition: opacity var(--fh-dur-instant) var(--fh-ease-quad);
			}

			.fh-switch-knob {
				position: absolute;
				top: -1px;
				bottom: -1px;
				left: -1px;

			.ho-tile {
				padding: 20px;
				border: 1px solid var(--fh-border);
				border-radius: 12px;

			.ho-tile.is-muted {

			.ho-tile h4 {

				font-size: 14px;
				font-weight: 600;

			.ho-id {

				flex-direction: column;
				background: var(--fh-bg);
				color: var(--fh-fg);
			}

			.ho-id-marks {
				display: flex;
				align-items: flex-end;
				gap: 20px;
			}

			.ho-id-sample {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-top: auto;
				padding: 12px 16px;
				border-radius: 12px;
				background: var(--fh-overlay-bg);
				box-shadow: var(--fh-shadow-floating-small);
				font-size: 14px;
			}

			.ho-id-marks + .ho-id-sample {
				margin-top: 28px;
			}

			.ho-id-sample b {
				flex: 1;
				font-weight: 600;
			}

			.ho-space {
				display: grid;
				gap: 10px;
			}

			.ho-space-row {
				display: grid;
				grid-template-columns: 48px 1fr;
				align-items: center;
				gap: 12px;

				color: var(--fh-fg-muted);

			.ho-space-row i {

				height: 12px;
				border-radius: 3px;
				background: var(--fh-accent-muted);
				box-shadow: inset 0 0 0 1px var(--fh-accent-border);
			}

			.ho-radii {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 20px 16px;
			}

			.ho-radius {
				display: grid;
				grid-template-columns: auto minmax(0, 1fr);
				gap: 2px 12px;
				align-items: center;
				color: var(--fh-fg-muted);
				font-size: 12px;
				line-height: 16px;
			}

			.ho-radius i {
				grid-row: span 2;
			}

			.ho-radius b {
				color: var(--fh-fg);
				font: 600 12px/16px var(--fh-mono);
			}

			.ho-radius i {
				display: block;
				width: 48px;
				height: 40px;
				border: 1px solid var(--fh-border);
				background: var(--fh-bg-muted);
			}

			.ho-shadows {
				display: grid;
				gap: 16px;
			}

			.ho-shadow {
				display: flex;
				align-items: center;
				gap: 16px;
				font-size: 12px;
				color: var(--fh-fg-muted);
			}

			.ho-shadow i {
				display: block;
				flex: none;
				width: 64px;
				height: 40px;
				border-radius: 8px;
				background: var(--fh-bg);
			}

			.ho-shadow b {
				display: block;
				color: var(--fh-fg);
				font-weight: 600;
				font-size: 13px;
			}

			.ho-motion {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: 16px;
			}

			.ho-curve {
				padding: 16px;
				border: 1px solid var(--fh-border);
				border-radius: 12px;
			}

			.ho-curve svg {
				display: block;
				width: 100%;
				height: auto;
				margin-bottom: 12px;
				overflow: visible;
			}

			.ho-curve b {
				display: block;
				font-size: 13px;
			}

			.ho-curve span {
				display: block;
				color: var(--fh-fg-muted);
				font-size: 12px;
				line-height: 18px;
			}

			.ho-curve code {
				font: 11px var(--fh-mono);
				color: var(--fh-fg);
			}

			.ho-track {
				position: relative;
				height: 6px;
				margin: 4px 0 14px;
				border-radius: 3px;
				background: var(--fh-neutral-muted);
			}

			.ho-track i {
				position: absolute;
				top: -3px;
				left: 0;
				width: 12px;
				height: 12px;
				border-radius: 50%;
				background: var(--fh-accent);
			}

			.ho-curve:hover .ho-track i,
			.ho-curve:focus-within .ho-track i {
				animation: ho-slide var(--d) var(--e) infinite alternate;
			}

			@keyframes ho-slide {
				to {
					left: calc(100% - 12px);
				}
			}

			.ho-card {
				border: 1px solid var(--fh-border);
				border-radius: 12px;
				overflow: hidden;
				background: var(--fh-bg);
			}

			.ho-card + .ho-card {
				margin-top: 24px;
			}

			.ho-card-head {
				display: flex;
				align-items: baseline;
				gap: 12px;
				padding: 20px 24px;
				border-bottom: 1px solid var(--fh-border-muted);
			}

			.ho-card-head h3 {
				margin: 0;
				font-size: 16px;
				line-height: 24px;
				font-weight: 600;
			}

			.ho-card-head .ho-primer {
				color: var(--fh-fg-muted);
				font: 12px var(--fh-mono);
			}

			.ho-card-head p {
				flex-basis: 100%;
				margin: 0;
			}

			.ho-card-head {
				flex-wrap: wrap;
			}

			.ho-card-head .ho-classes {
				margin-left: auto;
				color: var(--fh-fg-muted);
				font: 11px var(--fh-mono);
			}

			.ho-pair {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			.ho-stage {
				--gh-font: var(--fh-font);
				--gh-mono: var(--fh-mono);
				--gh-top: 0px;
				--gh-toolbar-h: 0px;
				position: relative;
				min-width: 0;
				padding: 32px 24px 24px;
				background: var(--fh-bg);
				color: var(--fh-fg);
				font-family: var(--fh-font);
			}

			.ho-stage + .ho-stage {
				border-left: 1px solid var(--fh-border-muted);
			}

			.ho-stage-tag {
				position: absolute;
				top: 10px;
				left: 12px;
				color: var(--fh-fg-muted);
				font: 500 10px/1 var(--fh-mono);
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.ho-stage * {
				box-sizing: border-box;
			}

			.ho-variants {
				display: flex;
				flex-wrap: wrap;
				gap: 16px 24px;
				align-items: flex-start;
			}

			.ho-variant {
				display: grid;
				gap: 8px;
				justify-items: start;
				min-width: 0;
			}

			.ho-variant > small {
				color: var(--fh-fg-muted);
				font: 500 11px/1.4 var(--fh-mono);
			}

			.ho-variant.is-wide {
				width: 100%;
			}

			.ho-mini-toolbar {
				display: flex;
				align-items: center;
				gap: 2px;
				padding: 4px 8px;
				border: 1px solid var(--fh-border-muted);
				border-radius: 8px;
				background: var(--fh-bg);
			}

			.ho-mini-toolbar .gh-btn {
				color: var(--fh-fg-muted);
			}

			.ho-mini-toolbar .fh-ctl {
				margin-left: 0;
			}

			.ho-stage .gh-tree {
				width: 280px;
				flex: none;
			}

			.ho-stage .gh-file {
				width: 100%;
			}

			.ho-stage .gh-file-header {
				position: relative;
				top: auto;
				border-radius: 6px;
				border-bottom: 0;
			}

			.ho-stage .fh-flash {
				margin-bottom: 0;
				animation: none;
			}

			.ho-stage .fh-blankslate {
				margin: 0;
				animation: none;

			.ho-stage .fh-box {

			.ho-map-page {

			.ho-map-bar {

				align-items: center;
				gap: 10px;
				height: 44px;
				padding: 0 14px;
				border-bottom: 1px solid var(--fh-border-muted);
			}

			.ho-map-pill {

				align-items: center;
				gap: 6px;
				height: 26px;
				padding: 0 10px;
				border-radius: 6px;
				background: var(--fh-accent-muted);
				box-shadow: inset 0 0 0 1px var(--fh-accent-border);
				color: var(--fh-accent);
				font-size: 12px;
				font-weight: 500;
			}

			.ho-map-pill.is-primary {
				width: 80px;
				height: 22px;
				border-radius: 6px;
				background: var(--fh-primary-bg);
				opacity: 0.8;
			}

			.ho-map-body {
				display: grid;
				grid-template-columns: 200px minmax(0, 1fr);
				gap: 18px;
				padding: 16px 14px 20px;
			}

			.ho-map-tree {
				display: grid;
				gap: 8px;
				align-content: start;
			}

			.ho-map-row {
				display: flex;
				align-items: center;
				gap: 8px;
				height: 22px;
				padding: 0 6px;
				border-radius: 4px;
			}

			.ho-map-row i {
				flex: 1;
				height: 8px;
				border-radius: 4px;
				background: var(--fh-neutral-muted);
			}

			.ho-map-row.is-ext {
				background: var(--fh-accent-muted);
				box-shadow: inset 0 0 0 1px var(--fh-accent-border);
				color: var(--fh-accent);
			}

			.ho-map-row .gh-icon {
				width: 12px;
				height: 12px;
			}

			.ho-map-diff {
				display: grid;
				gap: 10px;
				align-content: start;
			}

			.ho-map-zone {
				display: flex;
				align-items: center;
				justify-content: flex-start;
				padding: 0 12px;
				gap: 8px;
				height: 40px;
				border: 1px dashed var(--fh-accent);
				border-radius: 6px;
				color: var(--fh-accent);
				font-size: 12px;
				font-weight: 500;
			}

			.ho-map-flash {
				display: flex;
				align-items: center;
				gap: 8px;
				height: 34px;
				padding: 0 12px;
				border: 1px solid var(--fh-accent-border);
				border-radius: 6px;
				background: var(--fh-accent-muted);
				color: var(--fh-accent);
				font-size: 12px;
				font-weight: 500;
			}

			.ho-map-file {
				border: 1px solid var(--fh-border);
				border-radius: 6px;
				overflow: hidden;
			}

			.ho-map-file-head {
				display: flex;
				align-items: center;
				gap: 8px;
				height: 32px;
				padding: 0 10px;
				background: var(--fh-bg-muted);
				border-bottom: 1px solid var(--fh-border-muted);
			}

			.ho-map-file-head .fh-label {
				height: 18px;
				font-size: 11px;
			}

			.ho-map-file-body {
				display: grid;
				gap: 6px;
				padding: 10px;
			}

			.ho-map-file-body i {
				display: block;
				height: 7px;
				border-radius: 4px;
				background: var(--fh-neutral-muted);
			}

			.ho-pin {
				display: inline-grid;
				place-items: center;
				flex: none;
				width: 20px;
				height: 20px;
				border-radius: 50%;
				background: var(--fh-accent-emphasis);
				color: #fff;
				font: 600 11px/1 var(--fh-mono);
				box-shadow: 0 0 0 3px var(--fh-bg);
			}

			.ho-map-anchor {
				position: relative;
				display: inline-flex;
			}

			.ho-map-overlay {
				position: absolute;
				top: calc(100% + 6px);
				left: 0;
				z-index: 2;
				width: 190px;
				padding: 10px;
				border-radius: 10px;
				background: var(--fh-overlay-bg);
				box-shadow: var(--fh-shadow-floating-small);
				display: grid;
				gap: 7px;
			}

			.ho-map-overlay i {
				display: block;
				height: 7px;
				border-radius: 4px;
				background: var(--fh-neutral-muted);
			}

			.ho-map-overlay .ho-pin {
				position: absolute;
				top: -10px;
				right: -10px;

				width: 100%;
				border-collapse: collapse;
				font-size: 13px;

				color: var(--fh-fg-muted);
				font: 500 11px/16px var(--fh-mono);
				letter-spacing: 0.06em;
				text-align: left;
				text-transform: uppercase;
				white-space: nowrap;
			}

			.ho-table td {
				padding: 12px 16px 12px 0;
				border-bottom: 1px solid var(--fh-border-muted);
				vertical-align: top;
				text-wrap: pretty;
			}

			.ho-table td:first-child {
				white-space: nowrap;
			}

			.ho-table code {
				font: 12px/1.5 var(--fh-mono);
			}

			.ho-table .muted {
				color: var(--fh-fg-muted);
			}

			.ho-table .str {
				color: var(--fh-fg);
				font-weight: 500;
			}

				min-width: 22px;
				padding: 1px 6px;

				border-radius: 6px;
				background: var(--fh-bg-muted);
				color: var(--fh-fg);
				font: 500 11px/18px var(--fh-mono);
				text-align: center;
				white-space: nowrap;
			}

			.ho-notes {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 16px;
				margin-top: 32px;
			}

				padding: 20px;
				border: 1px solid var(--fh-border);
				border-radius: 12px;
			}

			.ho-note h4 {
				display: flex;
				align-items: center;
				gap: 8px;
				margin: 0 0 10px;
				font-size: 14px;
				font-weight: 600;
			}

			.ho-note h4 .gh-icon {
				color: var(--fh-accent);
			}

			.ho-note ul,
			.ho-note ol {
				margin: 0;
				padding-left: 18px;
				color: var(--fh-fg-muted);
			}

			.ho-note li + li {
				margin-top: 6px;
			}

			.ho-note li b {
				color: var(--fh-fg);
				font-weight: 600;
			}

			.ho-copy-group + .ho-copy-group {
				margin-top: 40px;
			}

			.ho-copy-group h3 {
				display: flex;
				align-items: baseline;
				gap: 10px;
				margin: 0 0 12px;
				font-size: 16px;
				font-weight: 600;
			}

			.ho-copy-group h3 small {
				color: var(--fh-fg-muted);
				font: 400 12px var(--fh-mono);
			}

			.ho-table.is-copy td:first-child {
				width: 230px;
			}

			.ho-table.is-copy td:nth-child(2) {
				width: 46%;
			}

				display: flex;
				align-items: center;
				gap: 12px;
				padding-top: 40px;
				color: var(--fh-fg-muted);
				font-size: 12px;
			}

			@media (max-width: 1100px) {

					grid-template-columns: minmax(0, 1fr);

				.ho-toc {
					display: none;
				}

				.ho-motion {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
				.ho-pair {
					grid-template-columns: minmax(0, 1fr);
				}
				.ho-stage + .ho-stage {
					border-left: 0;
					border-top: 1px solid var(--fh-border-muted);
				}
			}

			@media (max-width: 860px) {
				.fh-grid {
					grid-template-columns: minmax(0, 1fr);
				}
				.fh-nav {
					position: static;
				}
				.ho-principles,
				.ho-grid-2,
				.ho-grid-3,
				.ho-meta {
					grid-template-columns: minmax(0, 1fr);
				}
				.ho-title {
					font-size: 52px;
				}
				.ho-type-row {
					grid-template-columns: minmax(0, 1fr);
				}
				.ho-type-spec {
					text-align: left;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				[class*="fh-"],
				[class*="fh-"]::before,
				[class*="fh-"]::after,
				[class*="ho-"],
				[class*="ho-"]::before,
				[class*="ho-"]::after {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.01ms !important;
					transition-delay: 0s !important;
				}
			}
		</style>
	</head>

				GH.mount(document.getElementById("gh"));

				const Control = (() => {
					const el = document.createElement("div");
					el.className = "fh-ctl";
					el.innerHTML = `<button type="button" class="fh-ctl-btn fh-ctl-main"></button><span class="fh-ctl-sep" aria-hidden="true"></span><button type="button" class="fh-ctl-btn fh-ctl-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="fh-menu"></button>`;
					GH.slot("toolbar-start").append(el);
					const main = $(".fh-ctl-main", el);
					const sep = $(".fh-ctl-sep", el);
					const menuBtn = $(".fh-ctl-menu", el);
					let current = null;
					let signature = "";
					let announced = null;

					main.addEventListener("click", () => {
						if (current.view === "inactive") FH.activate();
						else if (current.view === "showing") FH.restore();
					});

						const key = `${v.view}|${v.hidden}|${v.match}`;
						if (announced === null) {
							announced = key;
							return;
						}
						if (key === announced) return;
						const previousView = announced.split("|")[0];
						announced = key;
						if (v.view === "filtering") announce(T.live.hidden(v.hidden));
						else if (v.view === "showing" && previousView !== "showing") announce(T.live.showing(v.match));
						else if (v.view === "inactive" && previousView !== "inactive") announce(T.live.off);
					}

					function update(d) {
						const v = controlView(d);
						const split = isSplit(v.view);
						const sig = `${v.view}|${v.auto}`;
						const hadMainFocus = document.activeElement === main;

							main.innerHTML = mainInner(v);
							menuBtn.innerHTML = menuInner(v);

					}

				const Menu = (() => {
					let ov = null;
					let typeahead = "";
					let typeTimer = 0;

					const items = () => $$('[role^="menuitem"]', ov);

					function position() {
						if (!ov) return;
						const anchor = Control.el.getBoundingClientRect();
						const w = ov.offsetWidth;
						let left = anchor.left;
						if (left + w > innerWidth - 8) left = Math.max(8, anchor.right - w);
						const top = anchor.bottom + 4;
						ov.style.left = `${Math.round(left)}px`;
						ov.style.top = `${Math.round(top)}px`;
						ov.style.maxHeight = `${Math.max(200, innerHeight - top - 12)}px`;
					}

					function render() {
						if (!ov) return;
						const focusedKey = ov.contains(document.activeElement) ? document.activeElement.dataset.key : null;
						ov.innerHTML = menuHtml(menuModel());

							const again = ov.querySelector(`[data-key="${CSS.escape(focusedKey)}"]`) || items()[0];
							again?.focus({ preventScroll: true });
						}
						position();
					}

					function open(focus = "first") {
						if (!ov) {
							Tip.hide();

								if (item) run(item);
							});
							Control.menuBtn.setAttribute("aria-expanded", "true");
							render();
						}
						const list = items();
						const target = focus === "last" ? list[list.length - 1] : list[0];
						(target || ov).focus({ preventScroll: true });
					}

					function close({ restore = true } = {}) {
						if (!ov) return;
						ov.remove();
						ov = null;

						if (restore) Control.focus();
					}

					function toggle(focus) {
						if (ov) close();
						else open(focus);
					}

					function run(item) {
						const key = item.dataset.key;
						if (key === "pr-toggle") {
							if (FH.detail.active) FH.deactivate();
							else FH.activate();
						} else if (key === "show-all") {
							FH.showAll();
							close();
						} else if (key === "hide-again") {
							FH.restore();
							close();
						} else if (key.startsWith("preset:")) {
							const id = key.slice(7);
							FH.setPresetEnabled(id, !FH.state.presets[id].enabled);
						} else if (key === "tree") {
							FH.setTreeFiltering(!FH.state.treeFiltering);
						} else if (key === "custom") {
							close({ restore: false });
							Settings.open("custom");
						} else if (key === "settings") {
							close({ restore: false });
							Settings.open("general");
						}
					}

					function onKey(e) {
						const list = items();
						const i = list.indexOf(document.activeElement);
						const move = (n) => list[(n + list.length) % list.length]?.focus();
						if (e.key === "ArrowDown") {
							e.preventDefault();
							move(i + 1);
						} else if (e.key === "ArrowUp") {
							e.preventDefault();
							move(i < 0 ? -1 : i - 1);
						} else if (e.key === "Home" || e.key === "PageUp") {
							e.preventDefault();
							move(0);
						} else if (e.key === "End" || e.key === "PageDown") {
							e.preventDefault();
							move(-1);
						} else if (e.key === "Enter" || e.key === " ") {
							e.preventDefault();
							if (i >= 0) run(list[i]);
						} else if (e.key === "Escape" || e.key === "Tab") {
							e.preventDefault();
							close();

							clearTimeout(typeTimer);
							typeahead += e.key.toLowerCase();

							const hit = order.find((it) => $(".fh-al-label", it).textContent.trim().toLowerCase().startsWith(typeahead));
							hit?.focus();
						}
					}

					document.addEventListener(
						"pointerdown",
						(e) => {
							if (ov && !ov.contains(e.target) && !Control.el.contains(e.target)) close({ restore: false });
						},
						true,
					);
					addEventListener("resize", position);
					addEventListener("scroll", () => requestAnimationFrame(position), true);

					return { open, close, toggle, render, get isOpen() {
						return !!ov;
					} };
				})();

				const revealMeta = new Map();

				function syncNotices(d) {
					const want = new Set(d.filtering ? d.revealed : []);

						const file = GH.fileEl(p);
						if (!file) continue;
						const meta = revealMeta.get(p) || { kind: "file" };

							return `<div class="ho-variants" style="flex-direction:column;align-items:stretch">${variant("Rule rows · rest, editing, invalid, custom rule off", `<div class="fh-box" style="width:100%"><div class="fh-box-header"><span class="fh-preset-icon">${icon("beaker")}</span><div class="fh-preset-text"><div class="fh-preset-title"><h3>Tests</h3>${labelHtml(T.s.modified, "attention")}</div><p class="fh-caption">Spec and test files, and everything inside __tests__ folders.</p></div><span class="fh-switch"><span class="fh-switch-status" aria-hidden="true">On</span>${switchVisual(true)}</span></div><ul class="fh-rules">${rows}</ul><div class="fh-box-footer">${Settings.addFormHtml({ list: "p:tests", placeholder: "**/*.integration.ts", draft: "**/*.integration.ts", error: T.s.duplicate, live: false })}</div></div>`, true)}</div>`;
						};
						const settingsCard = card(
							"Settings rows and fields",
							"Box · TextInput · FormControl validation · IconButton",
							"Rows are 45px with 12px monospace patterns. Edit swaps the row for a TextInput with Save and Cancel; errors use the danger border and a 12px semibold message tied by aria-describedby.",
							pair(presetDemo),
							".fh-box .fh-rule .fh-input .fh-validation .fh-iconbtn",
						);
						return `<section class="ho-section" id="ho-components" data-ho-section><div class="ho-section-head"><span class="ho-num">03</span><h2 class="ho-h2">Component inventory</h2><p class="ho-intro">Every state rendered live with the production classes, in both GitHub themes side by side. Nothing here is a picture.</p></div>${toolbarCard}${menuCard}${switchCard}${labelCard}${noticeCard}${treeCard}${emptyCard}${settingsCard}</section>`;
					}

					function injection() {
						const rows = [
							["1", "Toolbar", '<code>[data-gh-slot="toolbar-start"]</code>, after the File filter group', "ButtonGroup: Hide files + caret", "GitHub keeps its own view filters here. The toolbar is sticky, so status and the way back are always one click away."],
							["2", "Overlay root", "<code>document.body</code>", "ActionMenu, Tooltip, live region", "Escapes the sticky toolbar's stacking context. Positioned to the control's rect; repositions on scroll and resize. z-index 100, above file headers (5) and the toolbar (20)."],
							["3", "Diff list", "<code>#gh-files</code>, immediately before <code>.gh-file#diff-&lt;hash&gt;</code>", "Flash notice", "The explanation sits next to the file it explains and scrolls with it. Inserted idempotently because the list is observed."],
							["4", "File header", '<code>[data-gh-slot="file-actions"]</code>, first child', "Label: Temporarily visible / Always shown", "The sticky header keeps the state in view while reading. Placed left of Viewed so GitHub's controls never move."],
							["5", "Tree row", "<code>.gh-tree-file &gt; .gh-tree-row</code>, before <code>.gh-status</code>", "eye-off hint (tree filtering off), eye (revealed)", "Keeps the tree complete when asked to. The status icon stays last so columns align."],
							["6", "Diff column", '<code>[data-gh-slot="diff-top"]</code>', "Blankslate", "Replaces an empty diff with an explanation and a way out."],
							["7", "Tree bottom", '<code>[data-gh-slot="tree-bottom"]</code>', "Empty tree note", "Only when tree filtering hides every entry."],
							["8", "Options page", "<code>options_ui.page</code> → <code>chrome-extension://&lt;id&gt;/options.html</code>", "Settings", "Opened from the menu. Uses GitHub's settings anatomy so it feels like part of the same product."],
						];
						const map = `<div class="ho-map" aria-hidden="true"><div class="ho-map-page"><div class="ho-map-bar"><span class="ho-map-pill" style="width:16px;height:16px;border-radius:4px"></span><span class="ho-map-pill" style="width:120px"></span><span class="ho-map-pill" style="width:80px"></span><span class="ho-map-pill" style="width:100px"></span><span class="ho-map-pill" style="width:36px"></span><span class="ho-pin">1</span><span class="ho-map-anchor"><span class="ho-map-pill is-ext">${icon("eyeOff")}10 files hidden ${GH.icon("caret")}</span><span class="ho-map-overlay"><span class="ho-pin">2</span><i style="width:60%"></i><i></i><i style="width:80%"></i><i style="width:70%"></i><i style="width:40%"></i></span></span><span style="flex:1"></span><span class="ho-map-pill" style="width:90px"></span><span class="ho-map-pill is-primary"></span></div><div class="ho-map-body"><div class="ho-map-tree"><div class="ho-map-row"><i></i></div><div class="ho-map-row"><i></i></div><div class="ho-map-row is-ext">${icon("eyeOff")}<i style="background:var(--fh-accent-border)"></i><span class="ho-pin">5</span></div><div class="ho-map-row"><i></i></div><div class="ho-map-row"><i></i></div><div class="ho-map-zone" style="height:30px"><span class="ho-pin">7</span>tree-bottom</div></div><div class="ho-map-diff"><div class="ho-map-zone"><span class="ho-pin">6</span>diff-top · Blankslate</div><div class="ho-map-flash"><span class="ho-pin">3</span>${icon("info")}Temporarily visible…</div><div class="ho-map-file" style="border-color:var(--fh-accent-emphasis)"><div class="ho-map-file-head"><span class="ho-map-pill" style="width:200px"></span><span style="flex:1"></span><span class="ho-pin">4</span>${labelHtml(T.labelRevealed, "accent")}<span class="ho-map-pill" style="width:54px;height:18px;border-radius:5px"></span></div><div class="ho-map-file-body"><i style="width:80%"></i><i style="width:64%"></i><i style="width:72%"></i></div></div><div class="ho-map-file"><div class="ho-map-file-head"><span class="ho-map-pill" style="width:160px"></span><span style="flex:1"></span><span class="ho-map-pill" style="width:54px;height:18px;border-radius:5px"></span></div><div class="ho-map-file-body"><i style="width:70%"></i><i style="width:50%"></i></div></div></div></div></div></div>`;
						return `<section class="ho-section" id="ho-injection" data-ho-section><div class="ho-section-head"><span class="ho-num">04</span><h2 class="ho-h2">Injection points</h2><p class="ho-intro">Selectors are the prototype's slots. Map each to GitHub's equivalent anchor and re-check them on every GitHub release: diff, tree, lazy-loaded files and direct links.</p></div>${map}<table class="ho-table" style="margin-top:32px"><thead><tr><th></th><th>Surface</th><th>Anchor</th><th>Injects</th><th>Why</th></tr></thead><tbody>${rows.map(([n, s, a, w, y]) => `<tr><td><span class="ho-pin">${n}</span></td><td class="str" style="white-space:nowrap">${s}</td><td>${a}</td><td>${w}</td><td class="muted">${y}</td></tr>`).join("")}</tbody></table><div class="ho-notes"><div class="ho-note"><h4>${icon("lock")}Never touched</h4><ul><li><code class="ho-code">[data-gh-files-count]</code> Files changed counter</li><li><code class="ho-code">.gh-diffstat</code> additions, deletions and blocks</li><li><code class="ho-code">[data-gh-viewed]</code> viewed progress and every <code class="ho-code">.gh-viewed</code> checkbox</li><li>Review changes, comments, review state</li><li>GitHub nodes are hidden with a class, never removed</li></ul></div><div class="ho-note"><h4>${icon("reload")}Dynamic page rules</h4><ul><li>Re-run the sync on <b>gh:files-added</b> and on every engine change; each injection is idempotent.</li><li>Inserting the Flash into the observed file list triggers one extra pass; it must find nothing to change.</li><li>Count = distinct paths hidden in diff ∪ tree, never double counted.</li><li>Direct links: hash targets reveal the file, everything else stays hidden.</li></ul></div></div></section>`;
					}

					function interaction() {
						const keys = [
							["Toolbar", "<kbd class=\"ho-kbd\">Tab</kbd>", "Hide files (when shown), then the menu button."],
							["", "<kbd class=\"ho-kbd\">Enter</kbd> <kbd class=\"ho-kbd\">Space</kbd> on Hide files", "Activates. Focus moves to the menu button, which now reads “10 files hidden”."],
							["", "<kbd class=\"ho-kbd\">Enter</kbd> <kbd class=\"ho-kbd\">Space</kbd> <kbd class=\"ho-kbd\">↓</kbd> on the menu button", "Opens the menu with focus on the first item."],
							["", "<kbd class=\"ho-kbd\">↑</kbd> on the menu button", "Opens the menu with focus on the last item (Settings)."],
							["Menu", "<kbd class=\"ho-kbd\">↓</kbd> <kbd class=\"ho-kbd\">↑</kbd>", "Next or previous item, wrapping."],
							["", "<kbd class=\"ho-kbd\">Home</kbd> <kbd class=\"ho-kbd\">End</kbd>", "First or last item."],
							["", "<kbd class=\"ho-kbd\">Enter</kbd> <kbd class=\"ho-kbd\">Space</kbd>", "Runs the item. Checkbox items and switches keep the menu open and keep focus."],
							["", "<kbd class=\"ho-kbd\">A</kbd>–<kbd class=\"ho-kbd\">Z</kbd>", "Typeahead to the next item that starts with the letters."],
							["", "<kbd class=\"ho-kbd\">Esc</kbd> <kbd class=\"ho-kbd\">Tab</kbd>", "Closes; focus returns to the menu button. Outside click closes without moving focus."],
							["Notice", "<kbd class=\"ho-kbd\">Enter</kbd> on Hide again", "Hides the file, announces it, focus returns to the toolbar menu button."],
							["Tree", "Select a muted entry", "Opens it as a direct link: revealed temporarily, with the notice."],
							["Settings", "<kbd class=\"ho-kbd\">Enter</kbd> in a rule field", "Adds or saves. Focus stays in the add field for the next rule."],
							["", "<kbd class=\"ho-kbd\">Esc</kbd> while editing", "Cancels and returns focus to the row's edit button."],
						];
						return `<section class="ho-section" id="ho-interaction" data-ho-section><div class="ho-section-head"><span class="ho-num">05</span><h2 class="ho-h2">Interaction and keyboard</h2><p class="ho-intro">The control follows Primer's ActionMenu contract. Everything is reachable without a pointer and every change is announced once.</p></div><table class="ho-table"><thead><tr><th>Surface</th><th>Input</th><th>Result</th></tr></thead><tbody>${keys.map(([s, k, r]) => `<tr><td class="str">${s}</td><td>${k}</td><td class="muted">${r}</td></tr>`).join("")}</tbody></table><div class="ho-notes"><div class="ho-note"><h4>${icon("keyboard")}ARIA</h4><ul><li>Menu button: <code class="ho-code">aria-haspopup="menu"</code>, <code class="ho-code">aria-expanded</code>, <code class="ho-code">aria-controls</code>. Caret-only button: <code class="ho-code">aria-label="${T.options}"</code>.</li><li>Menu: <code class="ho-code">role="menu"</code>; items <code class="ho-code">menuitem</code> or <code class="ho-code">menuitemcheckbox</code> with <code class="ho-code">aria-checked</code>; groups labelled by their heading.</li><li>Settings switches: <code class="ho-code">&lt;button aria-pressed&gt;</code> labelled by the setting title; the On/Off text is <code class="ho-code">aria-hidden</code>.</li><li>Live region <code class="ho-code">role="status"</code>, polite, debounced 150ms.</li><li>Tooltips: <code class="ho-code">role="tooltip"</code>, linked with <code class="ho-code">aria-describedby</code> while open; shown on hover after 350ms and on keyboard focus.</li><li>Fields: <code class="ho-code">aria-invalid</code> + <code class="ho-code">aria-describedby</code> to the message.</li></ul></div><div class="ho-note"><h4>${icon("check")}Behavior</h4><ol><li>Filtering inactive or showing all → every file is visible.</li><li>Always show match → visible, labelled “Always shown” while filtering.</li><li>Any enabled preset rule or active custom rule → hidden.</li><li>Otherwise visible.</li></ol><ul style="margin-top:12px"><li><b>Manual</b>: activation is stored per <code class="ho-code">owner/repo#number</code> and survives reload; a new pull request starts inactive.</li><li><b>Automatic</b>: opens in Filtering; the button carries an Automatic Label.</li><li><b>Show all files</b> is session-only and never changes settings or mode.</li><li>Contrast: all text ≥ 4.5:1, icons and borders that carry meaning ≥ 3:1 in both themes. Focus ring 2px <code class="ho-code">--fh-focus</code>.</li></ul></div></div></section>`;
					}

					function copy() {
						const groups = COPY.map(
							([title, where, rows]) =>
								`<div class="ho-copy-group"><h3>${title} <small>${where}</small></h3><table class="ho-table is-copy"><thead><tr><th>Key</th><th>String</th><th>Notes</th></tr></thead><tbody>${rows.map(([k, s, n]) => `<tr><td><code>${esc(k)}</code></td><td class="str">${esc(s)}</td><td class="muted">${esc(n)}</td></tr>`).join("")}</tbody></table></div>`,
						).join("");
						return `<section class="ho-section" id="ho-copy" data-ho-section><div class="ho-section-head"><span class="ho-num">06</span><h2 class="ho-h2">Copy deck</h2><p class="ho-intro">English, sentence case, no exclamation marks. These are the exact strings the prototype renders; they come from one table in the source, so the deck cannot drift.</p></div>${groups}<div class="ho-footer">${logo(16)}<span>${T.product} · ${T.slogan}</span></div></section>`;
					}

					function render() {
						root.innerHTML = `<div class="ho-wrap"><nav class="ho-toc" aria-label="Handoff sections"><div class="ho-toc-title">${logo(20)}Native</div><ol>${[
							["ho-concept", "01", "Concept"],
							["ho-tokens", "02", "Design tokens"],
							["ho-components", "03", "Components"],
							["ho-injection", "04", "Injection points"],
							["ho-interaction", "05", "Interaction"],
							["ho-copy", "06", "Copy deck"],
						]
							.map(([id, n, l]) => `<li><a href="#${id}" data-ho-link="${id}"><span>${n}</span>${l}</a></li>`)
							.join("")}</ol></nav><main class="ho-main"><header class="ho-hero"><div class="ho-hero-top">${logoTile(56, 32)}<p class="ho-eyebrow">Design handoff · ${T.product}</p></div><h1 class="ho-title">Feels <em>built-in</em>.</h1><p class="ho-lede">File Hider should read as a feature GitHub shipped. Every surface is a <b>Primer component at Primer metrics</b>; the only identity cues are the logomark and <b>one restrained accent</b>.</p><dl class="ho-meta"><div><dt>Surfaces</dt><dd>Toolbar control, ActionMenu, notices, tree hints, empty state, options page</dd></div><div><dt>Themes</dt><dd>GitHub light and dark through Primer tokens</dd></div><div><dt>Accessibility</dt><dd>WCAG 2.2 AA, full keyboard, reduced motion</dd></div><div><dt>Source of truth</dt><dd>docs/product.md</dd></div></dl></header>${concept()}${tokens()}${components()}${injection()}${interaction()}${copy()}</main></div>`;
						root.addEventListener("click", (e) => {
							const link = e.target.closest("[data-ho-link]");
							if (!link) return;
							e.preventDefault();
							document.getElementById(link.dataset.hoLink)?.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
						});
						const links = $$("[data-ho-link]", root);
						const io = new IntersectionObserver(
							(entries) => {
								for (const en of entries) {
									if (!en.isIntersecting) continue;
									for (const l of links) l.classList.toggle("is-current", l.dataset.hoLink === en.target.id);
								}
							},
							{ rootMargin: "-30% 0px -60% 0px" },
						);
						for (const s of $$("[data-ho-section]", root)) io.observe(s);
					}

					return { render };
				})();

				Handoff.render();

				Proto.on("screen", () => {
					Menu.close({ restore: false });
					Tip.hide();
				});

				Proto.init({
					id: "prototype",
					title: "Native",
					screens: [
						{ id: "github", label: "Pull request" },
						{ id: "settings", label: "Settings page" },
						{ id: "handoff", label: "Handoff" },
					],
				});
			})();
		</script>
	</body>
</html>
